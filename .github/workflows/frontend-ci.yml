name: Frontend CI

# The gate this repository was missing.
#
# Only the backend was ever checked, so nothing stopped the frontend from
# breaking: `npm run lint` runs with `--max-warnings 0` and had been failing on
# a stale React hook dependency with no one to report it, and a build error
# would only have surfaced on someone's machine. Both now run on every push.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # `npm ci` rather than `npm install`: it installs exactly what the lockfile
    # pins, so CI cannot pass against a dependency tree no one else has.
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint
      working-directory: ./frontend
      run: npm run lint

    - name: Build
      working-directory: ./frontend
      run: npm run build
